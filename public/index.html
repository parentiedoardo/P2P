<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>P2P</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/themes.css">
  <link rel="stylesheet" href="/shell.css">
  <link rel="stylesheet" href="/stealth.css">
  <script>
    (function () {
      var d = document.documentElement, get = function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } };
      d.dataset.theme = get('bn:theme') || 'excel';
      var m = get('bn:mode'); d.dataset.mode = m === 'dark' || m === 'light' ? m : (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      try { if (sessionStorage.getItem('bn:stealthNow') === '1') { sessionStorage.removeItem('bn:stealthNow'); d.classList.add('stealth-boot'); } } catch (e) {}
      if (get('bn:mini') === '1') d.classList.add('mini');
      if (get('bn:startStealth') === '1') d.classList.add('stealth-boot');
      var l = get('bn:lang'); d.lang = l || ((navigator.language || 'it').toLowerCase().indexOf('it') === 0 ? 'it' : 'en');
    })();
  </script>
</head>
<body>
  <!-- Cornice del finto foglio di calcolo: la pagina sta "sopra" una tabella vuota -->
  <header class="shell" id="shell">
    <div class="xl-title">
      <a href="/" class="xl-home" data-i18n-title="newSession"><img class="xl-logo" src="/favicon.svg" alt="P2P" width="20" height="20"></a>
      <span class="xl-file">P2P</span><span class="xl-saved" data-i18n="savedState">· Salvato</span>
      <span class="xl-tools">
        <button id="btn-mode" type="button" class="xl-tool" data-i18n-title="modeTitle" aria-pressed="false">☾</button>
        <button id="btn-stealth" type="button" class="xl-tool" data-i18n-title="stealthTitle">▦ <kbd data-i18n="spaceKey">Spazio</kbd></button>
      </span>
    </div>
    <div class="xl-menu" id="shell-menu">
      <button type="button" class="xl-filebtn" data-file-menu aria-haspopup="true" aria-expanded="false">File</button>
      <span class="on" data-i18n="menuHome">Home</span><span data-i18n="menuInsert">Inserisci</span><span data-i18n="menuLayout">Layout di pagina</span><span data-i18n="menuFormulas">Formule</span><span data-i18n="menuData">Dati</span><span data-i18n="menuReview">Revisione</span><span data-i18n="menuView">Visualizza</span>
    </div>
    <div class="xl-formula"><span class="xl-name">A1</span><span class="xl-fx">ƒx</span><span class="xl-f" id="shell-f"></span></div>
    <div class="sheet-cols" id="sheet-cols" aria-hidden="true"></div>
  </header>
  <div class="sheet-rows" id="sheet-rows" aria-hidden="true"></div>

  <!-- Menu File: impostazioni (resta aperto finché non lo si chiude) -->
  <div id="file-panel" class="file-panel" hidden role="dialog" aria-labelledby="fp-title">
    <div class="fp-head"><b id="fp-title">File</b><button type="button" class="fp-close" id="fp-close" data-i18n-title="close">✕</button></div>
    <div class="fp-body">
      <section>
        <h3 data-i18n="newSession">Nuova sessione</h3>
        <div class="seg" role="radiogroup" data-i18n-title="gameLabel">
          <label><input type="radio" name="fp-kind" value="navale"><span data-i18n="kindNavale">Flotta</span></label>
          <label><input type="radio" name="fp-kind" value="scacchi"><span data-i18n="kindScacchi">Scacchi</span></label>
          <label><input type="radio" name="fp-kind" value="dama"><span data-i18n="kindDama">Dama</span></label>
        </div>
        <label class="fp-row"><span data-i18n="turnTime">Tempo per turno</span>
          <select id="fp-time">
            <option value="0" data-i18n="timeNone">Nessun limite</option>
            <option value="30">30 s</option><option value="60">1 min</option><option value="120">2 min</option><option value="300">5 min</option><option value="600">10 min</option>
          </select>
        </label>
        <div class="fp-actions">
          <button type="button" class="primary" id="fp-p2p" data-i18n="newP2P">P2P</button>
          <button type="button" id="fp-p1p" data-i18n="newP1P">P1P</button>
        </div>
      </section>
      <section>
        <h3 data-i18n="viewSection">Visualizza</h3>
        <label class="fp-row"><span data-i18n="theme">Tema</span>
          <select id="theme">
            <option value="mare" data-i18n="themeOffice">Ufficio</option>
            <option value="excel" data-i18n="themeExcel">Foglio di calcolo</option>
            <option value="tecnico" data-i18n="themeTech">Disegno tecnico</option>
            <option value="quaderno" data-i18n="themeNotebook">Quaderno a quadretti</option>
            <option value="sonar" data-i18n="themeSonar">Sonar</option>
          </select>
        </label>
        <div class="fp-row"><span data-i18n="modeLabel">Aspetto</span>
          <div class="seg seg2" role="radiogroup">
            <label><input type="radio" name="fp-mode" value="light"><span data-i18n="modeLight">☀ Chiaro</span></label>
            <label><input type="radio" name="fp-mode" value="dark"><span data-i18n="modeDark">☾ Scuro</span></label>
          </div>
        </div>
        <label class="fp-row"><span data-i18n="language">Lingua</span>
          <select id="lang"><option value="it">Italiano</option><option value="en">English</option></select>
        </label>
        <label class="fp-check"><input type="checkbox" id="btn-mini"> <span data-i18n="miniTitle">Campo in miniatura</span></label>
        <label class="fp-check"><input type="checkbox" id="fp-start-stealth"> <span data-i18n="startStealth">Apri sempre in modalità discreta</span></label>
        <button type="button" id="fp-stealth" class="fp-wide"><span data-i18n="stealth">Modalità discreta</span> <kbd data-i18n="spaceKey">Spazio</kbd></button>
      </section>
      <section>
        <h3 data-i18n="helpSection">Aiuto</h3>
        <button type="button" id="fp-tour" class="fp-wide" data-i18n="tourOpen">Come funziona</button>
      </section>
    </div>
  </div>

  <main>
    <!-- Home -->
    <section id="screen-home" class="card narrow" hidden>
      <h1 data-i18n="homeTitle">Nuova sessione</h1>
      <p class="muted" data-i18n="homeIntro"></p>
      <form id="form-create">
        <label for="name-create" data-i18n="yourName">Il tuo nome</label>
        <input id="name-create" maxlength="24" autocomplete="nickname" required data-i18n-placeholder="namePlaceholder">
        <label for="email-create"><span data-i18n="emailOptional">Email</span> <span class="muted" data-i18n="emailHint"></span></label>
        <input id="email-create" type="email" maxlength="254" autocomplete="email" data-i18n-placeholder="emailPlaceholder">
        <span class="field-label" id="kind-label" data-i18n="gameLabel">Gioco</span>
        <div class="seg" role="radiogroup" aria-labelledby="kind-label">
          <label><input type="radio" name="kind" value="navale" checked><span data-i18n="kindNavale">Flotta</span></label>
          <label><input type="radio" name="kind" value="scacchi"><span data-i18n="kindScacchi">Scacchi</span></label>
          <label><input type="radio" name="kind" value="dama"><span data-i18n="kindDama">Dama</span></label>
        </div>
        <label for="turn-time" data-i18n="turnTime">Tempo per turno</label>
        <select id="turn-time">
          <option value="0" data-i18n="timeNone">Nessun limite</option>
          <option value="30">30 s</option>
          <option value="60">1 min</option>
          <option value="120">2 min</option>
          <option value="300">5 min</option>
          <option value="600">10 min</option>
        </select>
        <button type="submit" class="primary" data-i18n="newP2P">P2P</button>
        <button type="button" id="btn-solo" data-i18n="newP1P">P1P</button>
      </form>
      <label class="check"><input type="checkbox" id="start-stealth"> <span data-i18n="startStealth"></span></label>
    </section>

    <!-- Ingresso in una sessione esistente -->
    <section id="screen-join" class="card narrow" hidden>
      <h1 data-i18n="joinTitle"></h1>
      <p class="muted" data-i18n="joinIntro"></p>
      <form id="form-join">
        <label for="name-join" data-i18n="yourName"></label>
        <input id="name-join" maxlength="24" autocomplete="nickname" required>
        <label for="email-join"><span data-i18n="emailOptional">Email</span> <span class="muted" data-i18n="emailHint"></span></label>
        <input id="email-join" type="email" maxlength="254" autocomplete="email" data-i18n-placeholder="emailPlaceholder">
        <button type="submit" class="primary" data-i18n="join"></button>
      </form>
    </section>

    <!-- Partita -->
    <section id="screen-game" hidden>
      <div class="status-row">
        <div id="status" class="status" role="status" aria-live="polite"></div>
        <span id="clock" class="clock" hidden data-i18n-title="clockTitle"></span>
        <button id="btn-restart" type="button" class="restart" data-i18n="restart"></button>
      </div>

      <div id="share" class="card share" hidden>
        <p data-i18n="shareText"></p>
        <div class="share-row">
          <input id="share-link" readonly>
          <button id="btn-copy" type="button" data-i18n="copy"></button>
        </div>
      </div>

      <div id="placement" class="card placement" hidden>
        <p id="placement-hint"></p>
        <div class="row">
          <button id="btn-rotate" type="button" data-i18n="rotate"></button>
          <button id="btn-random" type="button" data-i18n="random"></button>
          <button id="btn-clear" type="button" data-i18n="clear"></button>
          <button id="btn-ready" type="button" class="primary" disabled data-i18n="ready"></button>
        </div>
      </div>

      <details id="notify" class="card notify">
        <summary><span data-i18n="notifyTitle"></span> <span id="notify-summary" class="muted"></span></summary>
        <p class="muted" data-i18n="notifyIntro"></p>
        <div class="row">
          <button id="btn-push" type="button" class="primary" data-i18n="enablePush"></button>
          <span id="push-status" class="muted"></span>
        </div>
        <form id="form-email" class="inline">
          <label for="email-settings" data-i18n="emailForReminders"></label>
          <div class="share-row">
            <input id="email-settings" type="email" maxlength="254" autocomplete="email" data-i18n-placeholder="emailPlaceholder">
            <button type="submit" data-i18n="save"></button>
          </div>
        </form>
      </details>

      <div class="boards">
        <div class="board-wrap" id="wrap-me">
          <h2><span data-i18n="yourFleet"></span> <span id="my-name" class="muted"></span></h2>
          <div id="board-me" class="board"></div>
        </div>
        <div class="board-wrap" id="wrap-opp">
          <h2><span id="opp-title"></span> <span id="opp-online" class="dot"></span></h2>
          <div id="board-opp" class="board"></div>
        </div>
      </div>

      <div id="sq-area" class="sq-area" hidden>
        <div class="board-wrap">
          <h2><span id="sq-opp"></span> <span id="sq-opp-online" class="dot"></span></h2>
          <div id="board-sq" class="sqboard"></div>
          <h2 class="sq-me"><span id="sq-me"></span></h2>
        </div>
        <div class="sq-side">
          <p id="sq-last" class="muted"></p>
          <p id="sq-info" class="muted"></p>
        </div>
      </div>

      <div id="finished" class="card narrow center" hidden>
        <p id="finished-text" class="big"></p>
        <div class="row center-row">
          <button id="btn-rematch" type="button" class="primary" data-i18n="rematch" hidden></button>
          <a href="/" class="button" data-i18n="newGame"></a>
        </div>
      </div>
    </section>

    <div id="toast" class="toast" hidden></div>
  </main>

  <div id="stealth" class="stealth" hidden></div>

  <script type="module" src="/app.js"></script>
</body>
</html>
