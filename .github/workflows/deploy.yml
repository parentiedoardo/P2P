name: Pubblica su Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.166.0"
      - name: Segreti per le email (solo se presenti su GitHub)
        if: env.RESEND_API_KEY != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "$RESEND_API_KEY" | npx wrangler secret put RESEND_API_KEY
          if [ -n "$EMAIL_FROM" ]; then echo "$EMAIL_FROM" | npx wrangler secret put EMAIL_FROM; fi
      - name: Verifica che il sito risponda
        run: |
          URL=https://p2p.parentiedoardo.workers.dev
          check() {
            curl -fsS "$URL/" | grep -q "<title>P2P</title>" &&
            curl -fsS "$URL/api/config" | grep -q vapidPublicKey &&
            curl -fsS -X POST "$URL/api/games" -H 'content-type: application/json' -d '{"name":"Verifica"}' | grep -q gameId
          }
          # Subito dopo la prima pubblicazione il sito può rispondere con errori per qualche secondo.
          for i in 1 2 3 4 5 6; do
            if check; then echo "Sito online: $URL"; exit 0; fi
            sleep 10
          done
          exit 1
