name: Pubblica su Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.166.0"
      - name: Verifica che il sito risponda
        run: |
          URL=https://p2p.parentiedoardo.workers.dev
          sleep 5
          curl -fsS "$URL/" | grep -q "Battaglia navale"
          curl -fsS "$URL/api/config" | grep -q vapidPublicKey
          curl -fsS -X POST "$URL/api/games" -H 'content-type: application/json' -d '{"name":"Verifica"}' | grep -q gameId
          echo "Sito online: $URL"
